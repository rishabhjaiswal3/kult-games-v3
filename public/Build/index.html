<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>AI ARENA | Battle</title>
  <link rel="shortcut icon" href="TemplateData/unity-logo-dark.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #030710;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      color: #fff;
      overflow: hidden;
      user-select: none;
    }

    /* ──────────────────────────────────────────────────
       UNITY CONTAINER
    ────────────────────────────────────────────────── */
    #unity-container {
      position: fixed;
      width: 100%;
      height: 100%;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      background: #030710;
    }

    #unity-warning {
      position: absolute;
      left: 50%;
      top: 5%;
      transform: translate(-50%);
      background: white;
      padding: 10px;
      display: none;
      z-index: 20;
    }

    /* ──────────────────────────────────────────────────
       ARENA LOADER — full-screen overlay
    ────────────────────────────────────────────────── */
    #arena-loader {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #030710;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: opacity 1s ease;
    }

    #arena-loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Rain canvas */
    #rain-canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Hex/grid overlay */
    .grid-bg {
      position: absolute;
      inset: 0;
      z-index: 1;
      background-image:
        linear-gradient(rgba(139,92,246,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(139,92,246,.05) 1px, transparent 1px);
      background-size: 64px 64px;
      pointer-events: none;
    }

    /* Ambient vignette */
    .vignette {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: radial-gradient(ellipse at 50% 50%,
        transparent 30%,
        rgba(3,7,16,.5) 75%,
        rgba(3,7,16,.9) 100%);
      pointer-events: none;
    }

    /* Ambient glow blobs */
    .glow-left {
      position: absolute;
      left: -8%;
      top: 20%;
      width: 40vw;
      height: 40vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139,92,246,.18) 0%, transparent 70%);
      z-index: 2;
      pointer-events: none;
    }

    .glow-right {
      position: absolute;
      right: -8%;
      top: 20%;
      width: 40vw;
      height: 40vw;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(6,182,212,.14) 0%, transparent 70%);
      z-index: 2;
      pointer-events: none;
    }

    /* ──────────────────────────────────────────────────
       LOADER CONTENT
    ────────────────────────────────────────────────── */
    #loader-content {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 960px;
      padding: clamp(12px, 2vh, 24px) clamp(16px, 3vw, 40px) clamp(20px, 3vh, 40px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(16px, 3vh, 28px);
    }

    /* ── Brand ── */
    #arena-brand {
      font-family: 'Orbitron', monospace;
      font-size: clamp(1.6rem, 4.5vw, 3rem);
      font-weight: 900;
      letter-spacing: .18em;
      background: linear-gradient(135deg, #c4b5fd 0%, #8b5cf6 45%, #06b6d4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 40px rgba(139,92,246,.7));
      animation: brand-breathe 3.5s ease-in-out infinite;
    }

    @keyframes brand-breathe {
      0%, 100% { filter: drop-shadow(0 0 32px rgba(139,92,246,.6)); }
      50%       { filter: drop-shadow(0 0 60px rgba(139,92,246,1));  }
    }

    #mode-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: .6rem;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: rgba(255,255,255,.38);
      border: 1px solid rgba(139,92,246,.28);
      border-radius: 3px;
      padding: 3px 12px;
      margin-top: -20px;
    }

    /* ──────────────────────────────────────────────────
       BATTLE STAGE — agent cards + VS
    ────────────────────────────────────────────────── */
    #battle-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 4vw, 56px);
      width: 100%;
    }

    /* ── Agent Card ── */
    .agent-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      flex: 1;
      max-width: 230px;
      animation: card-in .6s ease both;
    }

    .agent-card.right { animation-delay: .15s; }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(20px) scale(.97); }
      to   { opacity: 1; transform: translateY(0)    scale(1);   }
    }

    /* ── Orb wrapper (handles float + ring) ── */
    .agent-orb {
      position: relative;
      width: clamp(100px, 14vw, 160px);
      height: clamp(100px, 14vw, 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: orb-float 4.5s ease-in-out infinite;
    }

    .agent-card.right .agent-orb { animation-delay: -2.2s; }

    @keyframes orb-float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-9px); }
    }

    /* Spinning outer ring */
    .orb-spin-ring {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px solid transparent;
      border-top-color: rgba(255,255,255,.12);
      border-left-color: rgba(255,255,255,.08);
      animation: spin 8s linear infinite;
    }

    .agent-card.right .orb-spin-ring { animation-direction: reverse; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Pulsing halo ring */
    .orb-halo {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      animation: halo-pulse 2.5s ease-in-out infinite;
    }

    .agent-card.right .orb-halo { animation-delay: -1.25s; }

    @keyframes halo-pulse {
      0%, 100% { transform: scale(1);    opacity: .5; }
      50%       { transform: scale(1.1); opacity: .12; }
    }

    /* Inner sphere */
    .orb-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid rgba(255,255,255,.12);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(2px);
    }

    /* Shine sweep */
    .orb-inner::after {
      content: '';
      position: absolute;
      top: -60%;
      left: -60%;
      width: 80%;
      height: 80%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,.25) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .orb-icon {
      font-size: clamp(2.4rem, 5.5vw, 4rem);
      filter: drop-shadow(0 0 16px rgba(255,255,255,.5));
      z-index: 1;
      animation: icon-breathe 3s ease-in-out infinite;
    }

    .agent-card.right .orb-icon { animation-delay: -1.5s; }

    @keyframes icon-breathe {
      0%, 100% { transform: scale(1);     filter: drop-shadow(0 0 14px rgba(255,255,255,.4)); }
      50%       { transform: scale(1.06); filter: drop-shadow(0 0 28px rgba(255,255,255,.7)); }
    }

    /* ── Agent text ── */
    .agent-name {
      font-family: 'Orbitron', monospace;
      font-size: clamp(.8rem, 2.2vw, 1.1rem);
      font-weight: 700;
      letter-spacing: .04em;
      text-align: center;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255,255,255,.3);
    }

    .agent-archetype {
      font-family: 'Share Tech Mono', monospace;
      font-size: .55rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(255,255,255,.3);
      text-align: center;
    }

    .agent-elo-row {
      display: flex;
      align-items: baseline;
      gap: 5px;
    }

    .elo-value {
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(1.1rem, 2.8vw, 1.5rem);
      font-weight: bold;
      letter-spacing: .04em;
    }

    .elo-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: .5rem;
      color: rgba(255,255,255,.28);
      letter-spacing: .12em;
    }

    .clan-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: .52rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      padding: 2px 10px;
      border-radius: 3px;
      border: 1px solid;
    }

    /* ── VS center ── */
    #vs-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      animation: card-in .4s ease both;
      animation-delay: .08s;
    }

    #vs-orb {
      position: relative;
      width: clamp(52px, 7vw, 76px);
      height: clamp(52px, 7vw, 76px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .vs-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(139,92,246,.5);
      animation: vs-pulse 2.2s ease-in-out infinite;
    }

    .vs-ring-2 {
      inset: -8px;
      border-color: rgba(139,92,246,.2);
      animation-delay: .6s;
    }

    @keyframes vs-pulse {
      0%, 100% { transform: scale(1);    opacity: .8; }
      50%       { transform: scale(1.15); opacity: .15; }
    }

    #vs-bubble {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, rgba(139,92,246,.45), rgba(139,92,246,.1) 65%, transparent);
      border: 1px solid rgba(139,92,246,.65);
      box-shadow: 0 0 36px rgba(139,92,246,.5), inset 0 0 20px rgba(139,92,246,.15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(.9rem, 2.5vw, 1.4rem);
    }

    #vs-text {
      font-family: 'Orbitron', monospace;
      font-size: clamp(1rem, 2.8vw, 1.5rem);
      font-weight: 900;
      letter-spacing: .12em;
      background: linear-gradient(135deg, #c4b5fd, #06b6d4);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #battle-short-id {
      font-family: 'Share Tech Mono', monospace;
      font-size: .45rem;
      color: rgba(255,255,255,.18);
      letter-spacing: .08em;
      text-align: center;
      max-width: 76px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ──────────────────────────────────────────────────
       PROGRESS / FOOTER
    ────────────────────────────────────────────────── */
    #loader-footer {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
    }

    /* Divider line */
    #divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(139,92,246,.25) 20%, rgba(6,182,212,.2) 80%, transparent);
      margin-bottom: 4px;
    }

    #progress-track {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,.07);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    #progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #7c3aed, #8b5cf6 40%, #06b6d4);
      border-radius: 2px;
      transition: width .35s cubic-bezier(.25,.46,.45,.94);
      box-shadow: 0 0 14px rgba(139,92,246,.9);
    }

    /* Shimmer over the track */
    #progress-track::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.1) 50%, transparent);
      background-size: 200% 100%;
      animation: shimmer 2s linear infinite;
    }

    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }

    #progress-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: .58rem;
      letter-spacing: .22em;
      color: rgba(255,255,255,.32);
      text-transform: uppercase;
    }

    #battle-id-label {
      font-family: 'Share Tech Mono', monospace;
      font-size: .44rem;
      letter-spacing: .1em;
      color: rgba(255,255,255,.12);
      text-align: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ──────────────────────────────────────────────────
       RESPONSIVE
    ────────────────────────────────────────────────── */
    @media (max-width: 520px) {
      .agent-name  { max-width: 90px;  font-size: .72rem; }
      .agent-orb   { width: 82px; height: 82px; }
      #battle-stage { gap: 10px; }
    }

    /* ──────────────────────────────────────────────────
       ORIENTATION PROMPT
    ────────────────────────────────────────────────── */
    #orientation-prompt {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.92);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: white;
      text-align: center;
      padding: 20px;
    }

    #orientation-prompt .rotate-icon { font-size: 60px; margin-bottom: 18px; animation: rotatePhone 2s ease-in-out infinite; }
    #orientation-prompt h2 { font-size: 20px; margin-bottom: 8px; font-weight: bold; }
    #orientation-prompt p  { font-size: 13px; max-width: 260px; opacity: .85; line-height: 1.4; }

    @keyframes rotatePhone {
      0%, 100% { transform: rotate(0deg); }
      50%       { transform: rotate(90deg); }
    }

    @media screen and (orientation: portrait) and (max-width: 768px) {
      #orientation-prompt { display: flex; }
      #unity-container { filter: blur(3px); }
    }
    @media screen and (orientation: landscape) {
      #orientation-prompt { display: none !important; }
      #unity-container    { filter: none; }
    }
  </style>
</head>

<body>
  <!-- Orientation prompt -->
  <div id="orientation-prompt">
    <div class="rotate-icon">📱</div>
    <h2>Rotate Your Device</h2>
    <p>Please rotate your device to landscape mode for the best gaming experience.</p>
  </div>

  <!-- ═══════════════════════════════════════════════
       ARENA LOADER
  ═══════════════════════════════════════════════ -->
  <div id="arena-loader">
    <canvas id="rain-canvas"></canvas>
    <div class="grid-bg"></div>
    <div class="vignette"></div>
    <div class="glow-left" id="glow-left"></div>
    <div class="glow-right" id="glow-right"></div>

    <div id="loader-content">

      <!-- Brand -->
      <div id="arena-brand">AI ARENA</div>
      <div id="mode-badge">RANKED MATCH</div>

      <!-- Battle stage -->
      <div id="battle-stage">

        <!-- ── Left agent ── -->
        <div class="agent-card" id="card-left">
          <div class="agent-orb">
            <div class="orb-spin-ring"></div>
            <div class="orb-halo" id="halo-left"></div>
            <div class="orb-inner" id="inner-left">
              <span class="orb-icon" id="icon-left">⚔️</span>
            </div>
          </div>
          <div class="agent-name"     id="name-left">—</div>
          <div class="agent-archetype" id="arch-left">AGENT</div>
          <div class="agent-elo-row">
            <span class="elo-value" id="elo-left">1000</span>
            <span class="elo-label">ELO</span>
          </div>
          <div class="clan-badge" id="clan-left">—</div>
        </div>

        <!-- ── VS center ── -->
        <div id="vs-center">
          <div id="vs-orb">
            <div class="vs-ring"></div>
            <div class="vs-ring vs-ring-2"></div>
            <div id="vs-bubble">⚔️</div>
          </div>
          <div id="vs-text">VS</div>
          <div id="battle-short-id"></div>
        </div>

        <!-- ── Right agent ── -->
        <div class="agent-card right" id="card-right">
          <div class="agent-orb">
            <div class="orb-spin-ring"></div>
            <div class="orb-halo" id="halo-right"></div>
            <div class="orb-inner" id="inner-right">
              <span class="orb-icon" id="icon-right">🛡️</span>
            </div>
          </div>
          <div class="agent-name"     id="name-right">—</div>
          <div class="agent-archetype" id="arch-right">AGENT</div>
          <div class="agent-elo-row">
            <span class="elo-value" id="elo-right">1000</span>
            <span class="elo-label">ELO</span>
          </div>
          <div class="clan-badge" id="clan-right">—</div>
        </div>

      </div><!-- /battle-stage -->

      <!-- Footer / progress -->
      <div id="loader-footer">
        <div id="divider"></div>
        <div id="progress-track">
          <div id="progress-fill"></div>
        </div>
        <div id="progress-label">LOADING AI ARENA... 0%</div>
        <div id="battle-id-label"></div>
      </div>

    </div><!-- /loader-content -->
  </div><!-- /arena-loader -->

  <!-- Unity container -->
  <div id="unity-container">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
    <div id="unity-warning"></div>
  </div>

  <!-- Disable streaming compile warning -->
  <script>try { WebAssembly.instantiateStreaming = undefined; } catch(e) {}</script>

  <!-- Unregister old service workers -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        for (let r of regs) r.unregister();
      });
    }
  </script>

  <script>
    /* ──────────────────────────────────────────────────────────────
       1. PARSE URL PARAMS
    ────────────────────────────────────────────────────────────── */
    var p = new URLSearchParams(window.location.search);

    var battleId        = p.get('battleId')           || '';
    var myAgentId       = p.get('myAgentId')          || '';
    var myAgentName     = p.get('myAgentName')        || 'Agent Alpha';
    var myAgentArch     = p.get('myAgentArchetype')   || 'BERSERKER';
    var myAgentElo      = p.get('myAgentElo')         || '1000';
    var myAgentClan     = p.get('myAgentClan')        || 'ZEROG';
    var opponentId      = p.get('opponentId')         || '';
    var opponentName    = p.get('opponentName')       || 'Agent Omega';
    var opponentArch    = p.get('opponentArchetype')  || 'TACTICIAN';
    var opponentElo     = p.get('opponentElo')        || '1000';
    var opponentClan    = p.get('opponentClan')       || 'BASE';
    var mode            = p.get('mode')               || 'RANKED';

    /* ──────────────────────────────────────────────────────────────
       2. ARCHETYPE + CLAN CONFIG
    ────────────────────────────────────────────────────────────── */
    var ARCH = {
      BERSERKER: { c1:'#f97316', c2:'#ef4444', icon:'🔥', label:'BERSERKER' },
      TACTICIAN: { c1:'#06b6d4', c2:'#3b82f6', icon:'🧠', label:'TACTICIAN' },
      DEFENDER:  { c1:'#10b981', c2:'#14b8a6', icon:'🛡️', label:'DEFENDER'  },
      ASSASSIN:  { c1:'#8b5cf6', c2:'#7c3aed', icon:'🗡️', label:'ASSASSIN'  },
      SUPPORT:   { c1:'#fbbf24', c2:'#f59e0b', icon:'✨', label:'SUPPORT'   },
      HYBRID:    { c1:'#ec4899', c2:'#a855f7', icon:'⚡', label:'HYBRID'    },
    };

    var CLAN = {
      ZEROG:  { color:'#00e68a', bg:'rgba(0,230,138,.12)',  border:'rgba(0,230,138,.38)'  },
      BASE:   { color:'#4f6cff', bg:'rgba(79,108,255,.12)', border:'rgba(79,108,255,.38)' },
      SOLANA: { color:'#9945ff', bg:'rgba(153,69,255,.12)', border:'rgba(153,69,255,.38)' },
    };

    function getArch(s) {
      return ARCH[(s||'').toUpperCase()] || { c1:'#8b5cf6', c2:'#7c3aed', icon:'⚡', label:(s||'AGENT').toUpperCase() };
    }
    function getClan(s) {
      return CLAN[(s||'').toUpperCase()] || { color:'#8b6dff', bg:'rgba(139,109,255,.12)', border:'rgba(139,109,255,.38)' };
    }

    /* ──────────────────────────────────────────────────────────────
       3. POPULATE AGENT CARDS
    ────────────────────────────────────────────────────────────── */
    function applyAgent(side, name, archStr, elo, clanStr) {
      var a = getArch(archStr);
      var c = getClan(clanStr);

      document.getElementById('name-'  + side).textContent = name || '—';
      document.getElementById('arch-'  + side).textContent = a.label;
      document.getElementById('icon-'  + side).textContent = a.icon;
      document.getElementById('elo-'   + side).textContent = (parseInt(elo,10)||1000).toLocaleString();
      document.getElementById('elo-'   + side).style.color = a.c1;

      var inner = document.getElementById('inner-' + side);
      inner.style.background = 'radial-gradient(circle at 34% 30%, ' + a.c1 + '55, ' + a.c2 + '22 60%, rgba(3,7,16,.6))';
      inner.style.boxShadow  = '0 0 50px ' + a.c1 + '55, inset 0 0 30px ' + a.c1 + '18';
      inner.style.borderColor = a.c1 + '45';

      var halo = document.getElementById('halo-' + side);
      halo.style.border     = '1px solid ' + a.c1 + '55';
      halo.style.boxShadow  = '0 0 18px ' + a.c1 + '30';

      // Update ambient glow blobs to match archetype colors
      if (side === 'left') {
        document.getElementById('glow-left').style.background =
          'radial-gradient(circle, ' + a.c1 + '20 0%, transparent 70%)';
      } else {
        document.getElementById('glow-right').style.background =
          'radial-gradient(circle, ' + a.c1 + '18 0%, transparent 70%)';
      }

      var clan = document.getElementById('clan-' + side);
      clan.textContent       = (clanStr || '—').toUpperCase();
      clan.style.color       = c.color;
      clan.style.background  = c.bg;
      clan.style.borderColor = c.border;
    }

    applyAgent('left',  myAgentName,  myAgentArch,  myAgentElo,  myAgentClan);
    applyAgent('right', opponentName, opponentArch, opponentElo, opponentClan);

    // Mode badge
    document.getElementById('mode-badge').textContent = (mode || 'RANKED').toUpperCase() + ' MATCH';

    // Battle ID display
    if (battleId) {
      var shortId = battleId.length > 16
        ? battleId.slice(0,8) + '…' + battleId.slice(-4)
        : battleId;
      document.getElementById('battle-short-id').textContent  = shortId;
      document.getElementById('battle-id-label').textContent  = 'BATTLE · ' + battleId;
    }

    /* ──────────────────────────────────────────────────────────────
       4. CANVAS RAIN ANIMATION
    ────────────────────────────────────────────────────────────── */
    (function() {
      var canvas = document.getElementById('rain-canvas');
      var ctx    = canvas.getContext('2d');
      var W, H;

      function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      var COUNT = Math.min(150, Math.floor(window.innerWidth * 0.14));
      var drops = [];
      for (var i = 0; i < COUNT; i++) {
        drops.push({
          x:  Math.random() * window.innerWidth,
          y:  Math.random() * window.innerHeight - window.innerHeight,
          len:   Math.random() * 25 + 8,
          speed: Math.random() * 6  + 3,
          op:    Math.random() * .28 + .04,
          w:     Math.random() < .15 ? 1.5 : .8,
        });
      }

      function tick() {
        ctx.clearRect(0, 0, W, H);
        for (var i = 0; i < drops.length; i++) {
          var d = drops[i];
          var g = ctx.createLinearGradient(d.x, d.y, d.x - 1.5, d.y + d.len);
          g.addColorStop(0,   'rgba(139,92,246,0)');
          g.addColorStop(.45, 'rgba(139,92,246,' + d.op + ')');
          g.addColorStop(1,   'rgba(6,182,212,'  + (d.op * .7) + ')');
          ctx.strokeStyle = g;
          ctx.lineWidth   = d.w;
          ctx.beginPath();
          ctx.moveTo(d.x,       d.y);
          ctx.lineTo(d.x - 1.5, d.y + d.len);
          ctx.stroke();

          d.y += d.speed;
          if (d.y > H + 10) {
            d.y    = -d.len - Math.random() * 120;
            d.x    = Math.random() * W;
            d.speed = Math.random() * 6 + 3;
          }
        }
        requestAnimationFrame(tick);
      }
      tick();
    })();

    /* ──────────────────────────────────────────────────────────────
       5. PROGRESS BAR HELPER
    ────────────────────────────────────────────────────────────── */
    var fillEl  = document.getElementById('progress-fill');
    var labelEl = document.getElementById('progress-label');

    function setProgress(prog) {
      var pct = Math.round(prog * 100);
      fillEl.style.width = pct + '%';
      labelEl.textContent = 'LOADING AI ARENA... ' + pct + '%';
    }

    /* ──────────────────────────────────────────────────────────────
       6. ORIENTATION
    ────────────────────────────────────────────────────────────── */
    var orientEl = document.getElementById('orientation-prompt');
    function handleOrientation() {
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        orientEl.style.display = window.innerHeight > window.innerWidth ? 'flex' : 'none';
      }
    }
    window.addEventListener('orientationchange', function() { setTimeout(handleOrientation, 100); });
    window.addEventListener('resize', handleOrientation);
    window.addEventListener('load',   handleOrientation);

    /* ──────────────────────────────────────────────────────────────
       7. UNITY WARNING BANNER
    ────────────────────────────────────────────────────────────── */
    var warnEl = document.getElementById('unity-warning');
    function unityShowBanner(msg, type) {
      var div = document.createElement('div');
      div.innerHTML = msg;
      warnEl.appendChild(div);
      if (type === 'error')        div.style.cssText = 'background:red;padding:10px;';
      else if (type === 'warning') {
        div.style.cssText = 'background:yellow;color:#000;padding:10px;';
        setTimeout(function() { warnEl.removeChild(div); warnEl.style.display = warnEl.children.length ? 'block' : 'none'; }, 5000);
      }
      warnEl.style.display = 'block';
    }

    /* ──────────────────────────────────────────────────────────────
       8. UNITY LOADER
       battleId is available in window.location.search for Unity C#:
         Application.absoluteURL → parse query string
    ────────────────────────────────────────────────────────────── */
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var vmeta = document.createElement('meta');
      vmeta.name    = 'viewport';
      vmeta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.head.appendChild(vmeta);
    }

    var unityCanvas = document.getElementById('unity-canvas');
    var buildUrl    = 'Build';
    var loaderScript = document.createElement('script');
    loaderScript.src = buildUrl + '/WarzoneV4.loader.js';

    loaderScript.onload = function() {
      createUnityInstance(unityCanvas, {
        dataUrl:            buildUrl + '/WarzoneV4.data',
        frameworkUrl:       buildUrl + '/WarzoneV4.framework.js',
        codeUrl:            buildUrl + '/WarzoneV4.wasm',
        streamingAssetsUrl: 'StreamingAssets',
        companyName:        'WarzoneWarrior',
        productName:        'WarzoneWarrior',
        productVersion:     '0.1',
        showBanner:         unityShowBanner,
      }, function(progress) {
        setProgress(progress);
      }).then(function(unityInstance) {
        // battleId is in the query string — Unity reads it via Application.absoluteURL.
        // We also SendMessage as a fallback for engines that prefer it.
        if (battleId) {
          try { unityInstance.SendMessage('GameManager', 'SetBattleId', battleId); } catch(e) {}
        }
        // Smooth fade-out of loader
        var loader = document.getElementById('arena-loader');
        loader.classList.add('fade-out');
        setTimeout(function() { loader.style.display = 'none'; }, 1000);
        handleOrientation();
      }).catch(function(msg) {
        console.error('[AI Arena] Unity load error:', msg);
        alert(msg);
      });
    };

    document.body.appendChild(loaderScript);
  </script>
</body>
</html>
